current:
  - title: Children Safe Space, Bokwoango
    category: Education and child wellbeing
    image: /assets/images/projects/safespace_project1.jpg
    alt: Children taking part in INADESU's safe-space activities
    description: >-
      Since 2019, the Children Safe Space has offered children affected by the
      Anglophone crisis a secure environment for age-appropriate play and
      learning in subjects including arts, agriculture, English, and mathematics.
      Children can also learn about their rights, and counselling is provided
      to children who have experienced sexual and gender-based violence.
    lead: Kevin Dzi
    members: Anna Bezua, Sylvie Leku, Kevin Dzi, Leku Willibroad
  - title: Improving the Children Safe Space
    category: Education and child wellbeing
    image: /assets/images/projects/safespace_project12.jpg
    alt: Children participating in an INADESU safe-space activity
    description: >-
      Safe-space classes have been meeting at the Bokwaongo Presbyterian Church.
      INADESU hopes to move to its own location to accommodate the growing
      number of children and provide more storage, and hopes to expand the
      Children Safe Space to other parts of the country.
    lead: Kevin Dzi
    members: Sylvie Leku, Anna Bezua
past:
  - title: Extra classes for children in the community
    year: 2016
    category: Education
    image: /assets/images/projects/Project1-Extra-classes.png
    alt: Children attending extra classes in the community
    description: >-
      During a period when children were not attending school in Cameroon's
      Northwest and Southwest regions and juvenile delinquency was becoming
      alarming in the community, INADESU organized classes for children in
      Bokwoango to keep them from these vices. About eight children attended
      regularly, with others joining from time to time.
  - title: Prevention of STDs and condom distribution to youths
    year: 2017
    category: Health
    image: /assets/images/projects/project2-sensitization.jpg
    alt: INADESU community sexual-health awareness activity
    description: >-
      On World AIDS Day, INADESU distributed condoms and raised awareness about
      sexually transmitted diseases and infections, focusing on prevention and
      safe practices among young people.
  - title: Educating pupils about gender-based violence
    year: 2018
    category: Education and human rights
    image: /assets/images/projects/project3-pupils-gender-violence.jpg
    alt: Pupils taking part in a gender-based violence awareness activity
    description: >-
      INADESU visited schools to raise awareness among pupils and teachers about
      gender-based violence, its forms, and its effects, with the aim of
      supporting safer environments and helping young people stand against
      violence and discrimination.
  - title: End Rape in our community
    year: 2019
    category: Advocacy and human rights
    image: /assets/images/projects/project4-end-rape.jpg
    alt: Community advocacy activity addressing sexual violence
    description: >-
      In response to the prevalence of rape, INADESU focused advocacy on the
      safety and wellbeing of pupils and students, encouraging young people to
      speak out against harassment and assault and promoting consent, respect,
      and accountability.
  - title: World Menstrual Hygiene Day
    year: 2021
    category: Social
    image: /assets/images/projects/project5-world-menstrual-hygience.jpg
    alt: Menstrual hygiene awareness activity
    description: >-
      INADESU provided menstrual hygiene education to girls and boys. The
      awareness sessions aimed to break stigma, build pride and empowerment,
      and support open discussion of menstrual health without shame or
      discrimination.
  - title: Teaching farmers to cultivate mushrooms
    year: 2021
    category: Agriculture
    image: /assets/images/projects/project6-mushroom-farming1.jpg
    alt: Mushroom cultivation training activity
    description: >-
      INADESU delivered specialized mushroom-cultivation training for young
      people, sharing practical skills intended to support sustainable
      livelihoods and economic resilience.
  - title: Teaching people to make flour products
    year: 2022
    category: Microentrepreneurship
    image: /assets/images/projects/project7-microentrepreuneurship.jpg
    alt: Pastry and flour-product training activity
    description: >-
      INADESU provided pastry-product training for young women, aiming to equip
      participants with skills to establish businesses and generate sustainable
      income.
  - title: Football competition for children
    year: 2022
    category: Social
    image: /assets/images/projects/football-for-kids.png
    alt: Children taking part in a football activity
    description: >-
      INADESU organized a football game for children to encourage recreation,
      friendship, physical and social skills, teamwork, and an inclusive
      environment.
  - title: Children's Christmas party
    year: 2022
    category: Social
    image: /assets/images/projects/christmas-kids.png
    alt: Children gathered for a Christmas celebration
    description: >-
      INADESU organized a Christmas party in Bokwoango, Buea, where children
      gathered for festive activities and a shared holiday celebration.
