<article class="news-block h-100">
  <div class="news-block-top">
    <a href="{{ include.post.url | relative_url }}"><img src="{{ include.post.image | relative_url }}" class="news-image img-fluid" alt="{{ include.post.image_alt | default: include.post.title | escape }}" loading="lazy"></a>
    <div class="news-category-block"><span class="category-block-link">{{ include.post.categories | first | default: "News" | escape }}</span></div>
  </div>
  <div class="news-block-info">
    <div class="news-block-date mt-2"><p><i class="bi-calendar4 custom-icon me-1" aria-hidden="true"></i><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %-d, %Y" }}</time></p></div>
    <div class="news-block-title mb-2"><h2 class="h4"><a href="{{ include.post.url | relative_url }}" class="news-block-title-link">{{ include.post.title | escape }}</a></h2></div>
    <div class="news-block-body"><p>{{ include.post.excerpt | strip_html | normalize_whitespace | truncate: 190 | escape }}</p></div>
    <a href="{{ include.post.url | relative_url }}" class="custom-btn btn">Read story</a>
  </div>
</article>
