<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.data.organisation.abbreviation | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta name="author" content="{{ site.data.organisation.name | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.data.organisation.abbreviation | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: '/assets/images/brand/inadesu-logo.png' | absolute_url }}">
    <link rel="icon" href="{{ '/assets/images/brand/inadesu-logo.png' | relative_url }}" type="image/png">
    <link href="{{ '/assets/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">
    <link href="{{ '/assets/css/bootstrap-icons.css' | relative_url }}" rel="stylesheet">
    <link href="{{ '/assets/css/templatemo-kind-heart-charity.css' | relative_url }}" rel="stylesheet">
    <link href="{{ '/assets/css/inadesu-overrides.css' | relative_url }}" rel="stylesheet">
  </head>
  <body id="top">
    {% include header.html %}
    {% include navigation.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/bootstrap.min.js' | relative_url }}" defer></script>
  </body>
</html>
